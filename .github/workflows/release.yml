name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          - name: Linux
            os: ubuntu-22.04
            platform: linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-s -w"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build/bin
          7z a "../../Pergamon-windows-amd64.zip" Pergamon.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent Pergamon.app "../../Pergamon-macos-universal.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czf "../../Pergamon-linux-amd64.tar.gz" Pergamon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pergamon-${{ runner.os }}
          path: |
            Pergamon-*.zip
            Pergamon-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
